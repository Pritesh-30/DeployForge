# The build every DeployForge app runs, called from the small workflow file
# DeployForge commits into the student's repository (see backend/app/ci/).
#
#   1. Ask DeployForge what to build. The request is authenticated with the
#      run's GitHub OIDC token, which proves which repository it comes from.
#   2. Build each directory the way the server would: its compose file, else
#      its Dockerfile, else Cloud Native Buildpacks.
#   3. Push the images to the student's own GitHub registry (ghcr.io).
#   4. Report the result and the log. DeployForge pulls the images and
#      deploys them.
#
# This file must stay in a public repository so that private repositories
# can call it.

name: DeployForge build

on:
  workflow_call:
    inputs:
      api-url:
        type: string
        required: true
      target:
        type: string
        required: true
      deployment:
        type: string
        required: false
        default: ""

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: ${{ inputs.api-url }}
      PACK_VERSION: "0.40.9"
    steps:
      - name: Register with DeployForge
        id: start
        env:
          TARGET: ${{ inputs.target }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail

          # A fresh identity token per call: they expire after a few minutes,
          # and a build can take longer than that.
          cat > "$RUNNER_TEMP/df-token.sh" <<'EOF'
          df_token() {
            local audience
            audience=$(jq -rn --arg a "$API_URL" '$a|@uri')
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value
          }
          EOF
          source "$RUNNER_TEMP/df-token.sh"

          plan="$RUNNER_TEMP/plan.json"
          body=$(jq -n --arg t "$TARGET" --arg d "$DEPLOYMENT" '{target: $t, deployment: $d}')
          code=$(curl -sS -o "$plan" -w '%{http_code}' -X POST "$API_URL/ci/runs" \
            -H "Authorization: Bearer $(df_token)" \
            -H "Content-Type: application/json" -d "$body")
          if [ "$code" != 200 ]; then
            echo "::error::DeployForge refused this run (HTTP $code): $(cat "$plan")"
            exit 1
          fi

          if [ "$(jq -r .build "$plan")" != true ]; then
            echo "::notice::Not deploying: $(jq -r .reason "$plan")"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The app's environment variables may be secrets. Keep them out of
          # the run's log (values too short to be secret would mask noise).
          jq -r '.env | to_entries[] | .value' "$plan" | while IFS= read -r value; do
            if [ "${#value}" -ge 4 ]; then echo "::add-mask::$value"; fi
          done

          echo "deployment=$(jq -r .deployment_id "$plan")" >> "$GITHUB_OUTPUT"

      - name: Check out
        if: steps.start.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Packages
        if: steps.start.outputs.skip != 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install pack
        if: steps.start.outputs.skip != 'true'
        run: |
          curl -fsSL "https://github.com/buildpacks/pack/releases/download/v${PACK_VERSION}/pack-v${PACK_VERSION}-linux.tgz" \
            | sudo tar -xz -C /usr/local/bin pack
          pack version

      - name: Build and push
        id: build
        if: steps.start.outputs.skip != 'true'
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1

          plan="$RUNNER_TEMP/plan.json"
          result="$RUNNER_TEMP/result.json"
          kind=$(jq -r .plan.kind "$plan")
          tag=$(jq -r .plan.tag "$plan")
          builder=$(jq -r .buildpacks.builder "$plan")
          run_image=$(jq -r '.buildpacks.run_image // ""' "$plan")
          node_default=$(jq -r '.buildpacks.default_node_version // ""' "$plan")

          # Single-line values only: an env file cannot hold a newline.
          envfile="$RUNNER_TEMP/build.env"
          jq -r '.env | to_entries[] | select(.value | test("\n") | not) | "\(.key)=\(.value)"' \
            "$plan" > "$envfile"

          # Same names, same order as the server (backend/app/runtime/compose.py
          # and backend/app/detection/detector.py).
          find_file() {
            local dir=$1; shift
            for name in "$@"; do
              if [ -f "$dir/$name" ]; then echo "$dir/$name"; return 0; fi
            done
            return 1
          }
          compose_file() { find_file "$1" compose.yaml compose.yml docker-compose.yaml docker-compose.yml; }
          dockerfile() { find_file "$1" Dockerfile dockerfile; }

          build_dockerfile() {  # image dir dockerfile
            echo "::group::docker build $1"
            docker build --tag "$1" --file "$3" --label deployforge.managed=true "$2"
            echo "::endgroup::"
            docker push "$1"
          }

          build_pack() {  # image dir
            local args=(build "$1" --path "$2" --builder "$builder" --env-file "$envfile" --publish)
            if [ -n "$run_image" ]; then args+=(--run-image "$run_image"); fi
            # Pin Node when the project has not, as the server does: the newest
            # Node needs a library no Paketo run image ships.
            if [ -n "$node_default" ] && [ -f "$2/package.json" ] \
              && ! grep -q '^BP_NODE_VERSION=' "$envfile" \
              && [ -z "$(jq -r '.engines.node // ""' "$2/package.json" 2>/dev/null)" ]; then
              args+=(--env "BP_NODE_VERSION=$node_default")
            fi
            echo "::group::pack build $1"
            pack "${args[@]}"
            echo "::endgroup::"
          }

          if [ "$kind" = stack ]; then
            services='{}'
            count=$(jq '.plan.services | length' "$plan")
            for i in $(seq 0 $((count - 1))); do
              name=$(jq -r ".plan.services[$i].name" "$plan")
              path=$(jq -r ".plan.services[$i].path" "$plan")
              image=$(jq -r ".plan.services[$i].image" "$plan")
              dir="$GITHUB_WORKSPACE/$path"
              echo "=== $name ($path) ==="
              if df=$(dockerfile "$dir"); then
                build_dockerfile "$image" "$dir" "$df"
              else
                build_pack "$image" "$dir"
              fi
              services=$(jq -c --arg k "$name" --arg v "$image" '. + {($k): $v}' <<<"$services")
            done
            jq -n --argjson s "$services" '{method: "compose", services: $s}' > "$result"
            exit 0
          fi

          path=$(jq -r .plan.path "$plan")
          image=$(jq -r .plan.image "$plan")
          prefix=$(jq -r .plan.image_prefix "$plan")
          dir="$GITHUB_WORKSPACE/$path"

          if cf=$(compose_file "$dir"); then
            echo "Building the services in $(basename "$cf") that have a build section."
            cd "$dir"
            # Compose substitutes ${VARS} from .env, as it will on the server.
            cp "$envfile" .env
            override="$RUNNER_TEMP/deployforge.images.yaml"
            echo "services:" > "$override"
            services='{}'
            # An assignment, so a compose file that does not parse fails the
            # step here (a failure inside a `for` list would go unnoticed).
            buildable=$(docker compose -f "$cf" config --format json \
              | jq -r '.services | to_entries[] | select(.value.build != null) | .key')
            for svc in $buildable; do
              component=$(echo "$svc" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9._-]/-/g')
              svc_image="$prefix/$component:$tag"
              printf '  %s:\n    image: %s\n' "$(jq -rn --arg s "$svc" '$s|@json')" "$svc_image" >> "$override"
              services=$(jq -c --arg k "$svc" --arg v "$svc_image" '. + {($k): $v}' <<<"$services")
            done
            if [ "$services" != '{}' ]; then
              docker compose -f "$cf" -f "$override" build
              for svc_image in $(jq -r '.[]' <<<"$services"); do docker push "$svc_image"; done
            fi
            jq -n --argjson s "$services" '{method: "compose", services: $s}' > "$result"
          elif df=$(dockerfile "$dir"); then
            build_dockerfile "$image" "$dir" "$df"
            jq -n --arg i "$image" '{method: "docker", image: $i}' > "$result"
          else
            build_pack "$image" "$dir"
            jq -n --arg i "$image" '{method: "buildpack", image: $i}' > "$result"
          fi

      - name: Report to DeployForge
        if: always() && steps.start.outputs.skip != 'true' && steps.start.outputs.deployment != ''
        env:
          DEPLOYMENT: ${{ steps.start.outputs.deployment }}
          OUTCOME: ${{ steps.build.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/df-token.sh"

          status="$OUTCOME"
          if [ "$JOB_STATUS" = cancelled ]; then status=cancelled; fi
          result="$RUNNER_TEMP/result.json"
          [ -f "$result" ] || echo '{}' > "$result"
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || : > "$log"

          # The log was captured before GitHub's masking, so the environment's
          # values are removed here before it leaves the runner.
          python3 - "$RUNNER_TEMP/plan.json" "$log" "$RUNNER_TEMP/log.txt" <<'EOF'
          import json, sys
          plan, src, dst = sys.argv[1:]
          text = open(src, encoding="utf-8", errors="replace").read()[-900_000:]
          for value in sorted(json.load(open(plan)).get("env", {}).values(), key=len, reverse=True):
              if len(value) >= 4:
                  text = text.replace(value, "***")
          open(dst, "w", encoding="utf-8").write(text)
          EOF

          error=""
          if [ "$status" = skipped ]; then
            error="The run failed before the build started (checkout or setup). See $RUN_URL"
          fi
          jq -n --arg status "$status" --arg error "$error" \
            --rawfile log "$RUNNER_TEMP/log.txt" --slurpfile r "$result" \
            '$r[0] + {status: $status, log: $log} + (if $error == "" then {} else {error: $error} end)' \
            > "$RUNNER_TEMP/report.json"

          curl -fsS -X POST "$API_URL/ci/runs/$DEPLOYMENT/result" \
            -H "Authorization: Bearer $(df_token)" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/report.json"
